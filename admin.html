<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice of Goila Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
box-sizing:border-box;
font-family:"Noto Sans Bengali",Arial,sans-serif;
}


body{

margin:0;
background:#f5f5fb;

}


.container{

max-width:1200px;
margin:auto;
padding:20px;

}



/* HEADER */

.header{

background:linear-gradient(135deg,#6B2C91,#a84de0);
color:white;

padding:18px 25px;

border-radius:20px;

display:flex;
align-items:center;
justify-content:space-between;

}


.brand{

display:flex;
align-items:center;
gap:15px;

}


.brand img{

width:55px;
height:55px;
border-radius:50%;
object-fit:cover;

}


.brand h1{

font-size:24px;
margin:0;

}


.menu-btn{

font-size:30px;
background:none;
color:white;
border:none;
cursor:pointer;

}



/* SIDE MENU */

.menu{

display:none;

background:white;

position:absolute;

right:25px;
top:90px;

width:230px;

border-radius:15px;

box-shadow:0 5px 20px #aaa;

padding:15px;

z-index:10;

}


.menu button{

width:100%;
padding:14px;

margin:5px 0;

border:none;

border-radius:10px;

background:#f1e6fa;

color:#6B2C91;

font-weight:bold;

}




/* LOGIN */

.card{

background:white;

margin-top:25px;

padding:25px;

border-radius:20px;

box-shadow:0 5px 20px #ddd;

}



input,textarea{

width:100%;

padding:14px;

margin-top:12px;

border-radius:12px;

border:1px solid #ddd;

}



.btn{

width:100%;

padding:14px;

margin-top:15px;

border:none;

border-radius:12px;

background:#6B2C91;

color:white;

font-weight:bold;

}




/* DASHBOARD */


.stats{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(200px,1fr));

gap:20px;

margin-top:20px;

}



.stat{

background:white;

padding:20px;

border-radius:18px;

box-shadow:0 5px 15px #ddd;

}


.stat h3{

color:#777;

}


.stat p{

font-size:32px;

font-weight:bold;

color:#6B2C91;

}




.item{

background:#fafafa;

padding:20px;

margin-top:15px;

border-radius:15px;

border:1px solid #ddd;

}




.approve{

background:green;

color:white;

}


.reject{

background:red;

color:white;

}


.edit{

background:#6B2C91;

color:white;

}


.delete{

background:#d60000;

color:white;

}


.action{

padding:12px;

border:none;

border-radius:10px;

margin-top:10px;

width:48%;

}




.modal{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:#0008;

align-items:center;
justify-content:center;

}


.modal-box{

background:white;

padding:25px;

width:90%;

max-width:500px;

border-radius:20px;

}



@media(max-width:600px){

.brand h1{

font-size:18px;

}

}



</style>


</head>


<body>


<div class="container">



<div class="header">


<div class="brand">

<img src="images/logo.png">


<h1>
Voice of Goila Admin
</h1>


</div>


<button class="menu-btn" onclick="toggleMenu()">

☰

</button>


</div>




<div id="menu" class="menu">


<button onclick="showDashboard()">
Dashboard
</button>


<button onclick="showDirectory()">
Directory Management
</button>


<button onclick="logout()">
Logout
</button>


</div>





<div id="loginBox" class="card">


<h2>
Admin Login
</h2>


<input id="email" placeholder="Email">


<input id="password" type="password" placeholder="Password">


<button class="btn" onclick="login()">
Login
</button>


</div>






<div id="dashboard" style="display:none;">



<div class="stats">


<div class="stat">

<h3>Total Directory</h3>

<p id="totalDirectory">
0
</p>

</div>



<div class="stat">

<h3>Pending</h3>

<p id="totalPending">
0
</p>

</div>



<div class="stat">

<h3>Approved</h3>

<p id="totalApproved">
0
</p>

</div>



</div>






<div class="card">


<h2>
Pending Submission
</h2>


<div id="pending">

Loading...

</div>


</div>





<div class="card">


<h2>
Directory Management
</h2>


<input id="searchBox"
placeholder="Search..."
onkeyup="searchDirectory()">


<div id="directoryList">

Loading...

</div>


</div>



</div>





</div>





<div id="editModal" class="modal">


<div class="modal-box">


<h2>
Edit Information
</h2>


<input id="editId" type="hidden">


<input id="editName" placeholder="Name">


<input id="editCat" placeholder="Category">


<input id="editSubcat" placeholder="Sub Category">


<input id="editPhone" placeholder="Phone">


<textarea id="editAddress" placeholder="Address"></textarea>


<input id="editMap" placeholder="Map URL">


<button class="btn" onclick="updateDirectory()">
Save
</button>


</div>


</div>






<script src="js/supabase.js"></script>

<script src="js/admin.js"></script>


</body>


    </html>
