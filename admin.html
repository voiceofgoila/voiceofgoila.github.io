<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice of Goila Admin Dashboard</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
box-sizing:border-box;
font-family:"Noto Sans Bengali",Arial,sans-serif;
}


body{
margin:0;
background:#f4f5fb;
color:#222;
}


.container{
max-width:1100px;
margin:auto;
padding:20px;
}


.header{

background:linear-gradient(135deg,#6B2C91,#9b59b6);
color:white;
padding:25px;
border-radius:20px;
display:flex;
justify-content:space-between;
align-items:center;

}


.header h1{
margin:0;
font-size:28px;
}


.logout{

background:white;
color:#6B2C91;
border:none;
padding:12px 20px;
border-radius:10px;
font-weight:bold;
cursor:pointer;

}



.stats{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-top:20px;

}


.stat-card{

background:white;
padding:20px;
border-radius:18px;
box-shadow:0 5px 15px #ddd;

}


.stat-card h3{

margin:0;
color:#777;

}


.stat-card p{

font-size:30px;
font-weight:bold;
color:#6B2C91;

}



.section{

background:white;
padding:25px;
margin-top:25px;
border-radius:20px;
box-shadow:0 5px 20px #ddd;

}


.section h2{

margin-top:0;
color:#6B2C91;

}



.search{

width:100%;
padding:14px;
border-radius:12px;
border:1px solid #ddd;
margin-bottom:15px;

}



.item{

border:1px solid #ddd;
border-radius:15px;
padding:18px;
margin-top:15px;
background:#fafafa;

}


.item h3{

margin-top:0;

}



button{

cursor:pointer;
border:none;
padding:12px 18px;
border-radius:10px;
font-weight:bold;

}



.approve{

background:#00a651;
color:white;

}


.reject,.delete{

background:#e60000;
color:white;

}


.edit{

background:#6B2C91;
color:white;

}



.modal{

display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0008;
align-items:center;
justify-content:center;

}


.modal-box{

background:white;
padding:25px;
border-radius:20px;
width:90%;
max-width:500px;

}


.modal input,
.modal textarea,
.modal select{

width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ddd;
border-radius:10px;

}


.save{

background:#6B2C91;
color:white;
width:100%;
margin-top:15px;

}



@media(max-width:600px){

.header{

flex-direction:column;
gap:15px;
text-align:center;

}

}


</style>


</head>



<body>


<div class="container">


<div class="header">

<h1>
Voice of Goila Admin
</h1>

<button class="logout" onclick="logout()">
Logout
</button>


</div>




<div id="loginBox" class="section">


<h2>Admin Login</h2>


<input id="email" class="search" placeholder="Email">


<input id="password" class="search" type="password" placeholder="Password">


<button class="save" onclick="login()">
Login
</button>


</div>





<div id="dashboard" style="display:none;">



<div class="stats">


<div class="stat-card">
<h3>Total Directory</h3>
<p id="totalDirectory">0</p>
</div>


<div class="stat-card">
<h3>Pending</h3>
<p id="totalPending">0</p>
</div>


<div class="stat-card">
<h3>Approved</h3>
<p id="totalApproved">0</p>
</div>


</div>





<div class="section">


<h2>
Pending Submissions
</h2>


<div id="pending">

Loading...

</div>


</div>






<div class="section">


<h2>
Directory Management
</h2>


<input 
class="search"
id="searchBox"
placeholder="Search directory..."
onkeyup="searchDirectory()"
>


<div id="directoryList">

Loading...

</div>


</div>




</div>




</div>






<div id="editModal" class="modal">


<div class="modal-box">


<h2>Edit Information</h2>


<input id="editId" type="hidden">


<input id="editName" placeholder="Name">


<input id="editCat" placeholder="Category">


<input id="editSubcat" placeholder="Sub Category">


<input id="editPhone" placeholder="Phone">


<textarea id="editAddress" placeholder="Address"></textarea>


<input id="editMap" placeholder="Map URL">



<button class="save" onclick="updateDirectory()">
Save Changes
</button>



</div>

</div>






<script src="js/supabase.js"></script>

<script src="js/admin.js"></script>


</body>

    </html>
