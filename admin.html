<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice of Goila Admin</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>


*{
box-sizing:border-box;
}


body{

font-family:Arial,sans-serif;

background:#f4f4f8;

margin:0;

padding:20px;

}



.container{

max-width:900px;

margin:auto;

}



/* Header */

.header{


background:linear-gradient(135deg,#6B2C91,#b64cff);

color:white;

padding:25px;

border-radius:25px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 10px 25px #ddd;


}



.header h1{

margin:0;

font-size:28px;

}



.menuBtn{


background:none;

border:none;

color:white;

font-size:35px;

width:60px;

cursor:pointer;


}




/* Menu */


#menu{


display:none;

background:white;

margin-top:15px;

padding:15px;

border-radius:15px;

box-shadow:0 5px 15px #ddd;


}



#menu button{


margin-top:10px;


}




/* Card */


.card{


background:white;

padding:25px;

margin-top:20px;

border-radius:20px;

box-shadow:0 5px 20px #ddd;


}





input,
select,
textarea,
button{


width:100%;

padding:14px;

margin-top:10px;

border-radius:10px;

border:1px solid #ddd;

font-size:16px;


}



button{


background:#6B2C91;

color:white;

border:none;

cursor:pointer;


}



button:hover{

opacity:.9;

}




/* Dashboard */


.stats{


display:grid;

grid-template-columns:repeat(3,1fr);

gap:15px;


}


.stat{


background:#fafafa;

padding:20px;

border-radius:15px;

text-align:center;


}



.stat h2{


color:#6B2C91;

font-size:35px;


}




/* Items */


.item{


background:#fafafa;

padding:20px;

margin-top:15px;

border-radius:15px;

border:1px solid #ddd;


}



.item h3{

margin-top:0;

}



.approve{

background:green;

}


.reject{

background:red;

}


.edit{

background:#008000;

}


.delete{

background:red;

}




/* Mobile */


@media(max-width:600px){


.stats{

grid-template-columns:1fr;

}



.header h1{

font-size:22px;

}


}



</style>


</head>




<body>


<div class="container">



<!-- Header -->


<div class="header">


<h1>
Voice of Goila Admin
</h1>


<button class="menuBtn" onclick="toggleMenu()">

☰

</button>


</div>



<!-- Menu -->


<div id="menu">


<button onclick="showDashboard()">

Dashboard

</button>


<button onclick="showDirectory()">

Directory

</button>



<button onclick="logout()">

Logout

</button>


</div>





<!-- Login -->


<div class="card" id="loginBox">


<h2>
Admin Login
</h2>



<input 
id="email"
placeholder="Email">



<input
id="password"
type="password"
placeholder="Password">



<button onclick="login()">

Login

</button>


</div>





<!-- Dashboard -->


<div id="dashboard" style="display:none;">



<div class="card">


<div class="stats">


<div class="stat">


<h3>Total Directory</h3>

<h2 id="total">

0

</h2>


</div>



<div class="stat">


<h3>Pending</h3>

<h2 id="pendingCount">

0

</h2>


</div>



<div class="stat">


<h3>Approved</h3>

<h2 id="approvedCount">

0

</h2>


</div>



</div>


</div>





<!-- Pending -->


<div class="card">


<h2>

Pending Submission

</h2>


<div id="pending">

Loading...

</div>



</div>







<!-- Directory -->


<div class="card">


<h2>

Directory Management

</h2>



<div id="directory">

Loading...

</div>



</div>





</div>





</div>





<script src="js/supabase.js"></script>

<script src="js/admin.js"></script>



</body>


  </html>
