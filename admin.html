<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice of Goila Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}


.container{
    max-width:900px;
    margin:auto;
}


h1{
    text-align:center;
    color:#6B2C91;
}


.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-top:20px;
    box-shadow:0 3px 10px #ddd;
}


input,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:6px;
    border:1px solid #ddd;
}


button{
    background:#6B2C91;
    color:white;
    border:none;
    cursor:pointer;
}


.item{

    background:#fafafa;
    padding:15px;
    margin-top:15px;
    border-radius:10px;
    border:1px solid #ddd;

}


.approve{
    background:green;
}


.reject{
    background:red;
}


.delete{
    background:#cc0000;
}


</style>

</head>


<body>


<div class="container">


<h1>
Voice of Goila Admin Panel
</h1>



<div class="card" id="loginBox">


<h2>Admin Login</h2>


<input id="email" placeholder="Email">


<input id="password" type="password" placeholder="Password">


<button onclick="login()">
Login
</button>


</div>




<div id="dashboard" style="display:none;">



<div class="card">

<h2>
Pending Submissions
</h2>


<div id="pending">

Loading...

</div>


</div>





<div class="card">

<h2>
Directory Management
</h2>


<div id="directoryList">

Loading...

</div>


</div>



</div>


</div>



<script src="js/supabase.js"></script>

<script src="js/admin.js"></script>


</body>

</html>
