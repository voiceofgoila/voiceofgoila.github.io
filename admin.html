<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice of Goila Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

margin:0;
padding:20px;
background:#f5f5f8;

}



.container{

max-width:1000px;
margin:auto;

}



.header{

background:linear-gradient(135deg,#6B2C91,#ad4cff);

padding:25px;

border-radius:20px;

display:flex;

justify-content:space-between;

align-items:center;

color:white;

}


.header h1{

margin:0;

font-size:26px;

}


.menu-btn{

background:none;

border:none;

font-size:35px;

color:white;

cursor:pointer;

width:60px;

}



.menu{

display:none;

background:white;

padding:15px;

margin-top:15px;

border-radius:15px;

box-shadow:0 5px 15px #ddd;

}


.menu button{

margin-top:10px;

}



.card{

background:white;

padding:25px;

margin-top:20px;

border-radius:20px;

box-shadow:0 5px 20px #ddd;

}



input,
select,
textarea,
button{

width:100%;

padding:13px;

margin-top:10px;

border-radius:10px;

border:1px solid #ddd;

}



button{

background:#6B2C91;

color:white;

border:none;

cursor:pointer;

}



.stats{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:15px;

}



.stat{

background:#fafafa;

padding:20px;

border-radius:15px;

text-align:center;

}


.stat h2{

color:#6B2C91;

font-size:35px;

}



.item{

background:#fafafa;

padding:20px;

border-radius:15px;

margin-top:15px;

border:1px solid #ddd;

}



.approve{

background:green;

}


.reject{

background:red;

}


.edit{

background:#008000;

}


.delete{

background:#d00000;

}




.action{

width:48%;

display:inline-block;

}



.modal{

display:none;

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

background:#0008;

align-items:center;

justify-content:center;

}



.modal-box{

background:white;

padding:25px;

width:90%;

max-width:500px;

border-radius:20px;

}



@media(max-width:600px){


.stats{

grid-template-columns:1fr;

}


.header h1{

font-size:20px;

}


}


</style>

</head>



<body>


<div class="container">



<div class="header">

<h1>
Voice of Goila Admin
</h1>


<button class="menu-btn" onclick="toggleMenu()">
☰
</button>


</div>



<div id="menu" class="menu">


<button onclick="showDashboard()">
Dashboard
</button>


<button onclick="showDirectory()">
Directory
</button>


<button onclick="logout()">
Logout
</button>


</div>





<div class="card" id="loginBox">


<h2>
Admin Login
</h2>


<input id="email" placeholder="Email">


<input id="password" type="password" placeholder="Password">


<button onclick="login()">
Login
</button>


</div>







<div id="dashboard" style="display:none;">



<div class="card">


<div class="stats">


<div class="stat">

<h3>Total</h3>

<h2 id="total">
0
</h2>


</div>


<div class="stat">

<h3>Pending</h3>

<h2 id="pendingCount">
0
</h2>


</div>


<div class="stat">

<h3>Approved</h3>

<h2 id="approvedCount">
0
</h2>


</div>


</div>


</div>






<div class="card">


<h2>
Pending Submission
</h2>


<div id="pending">

Loading...

</div>


</div>







<div class="card">


<h2>
Directory Management
</h2>


<input id="searchBox" placeholder="Search...">


<div id="directory">

Loading...

</div>


</div>



</div>




</div>





<!-- Edit Modal -->


<div id="editModal" class="modal">


<div class="modal-box">


<h2>
Edit Information
</h2>



<input id="editId" type="hidden">


<input id="editName" placeholder="Name">



<select id="editCat"
onchange="changeSubCategory()">

</select>




<select id="editSubcat">

</select>




<input id="editPhone" placeholder="Phone">


<textarea id="editAddress"
placeholder="Address"></textarea>



<input id="editMap"
placeholder="Map URL">



<textarea id="editDescription"
placeholder="Description"></textarea>



<button onclick="updateDirectory()">

Save Changes

</button>



</div>

</div>





<script src="js/supabase.js"></script>

<script src="js/admin.js"></script>


</body>

</html>
