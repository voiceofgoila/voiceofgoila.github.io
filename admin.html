<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Voice of Goila Admin</title>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

*{
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{
margin:0;
padding:20px;
background:#f5f5f8;
}



.container{
max-width:1000px;
margin:auto;
}



.header{

background:linear-gradient(135deg,#6B2C91,#ad4cff);

padding:25px;

border-radius:20px;

display:flex;

justify-content:space-between;

align-items:center;

color:white;

}



.header h1{
margin:0;
font-size:26px;
}



.menu-btn{

width:60px !important;

height:60px;

background:transparent;

border:none;

font-size:35px;

color:white;

cursor:pointer;

}



.menu{

display:none;

background:white;

padding:15px;

margin-top:15px;

border-radius:15px;

box-shadow:0 5px 15px #ddd;

}



.card{

background:white;

padding:25px;

margin-top:20px;

border-radius:20px;

box-shadow:0 5px 20px #ddd;

}



input,
select,
textarea,
button{

width:100%;

padding:13px;

margin-top:10px;

border-radius:10px;

border:1px solid #ddd;

}



button{

background:#6B2C91;

color:white;

border:none;

cursor:pointer;

}



.password-box{

position:relative;

}



.password-box input{

padding-right:50px;

}



.password-eye{

position:absolute;

right:15px;

top:23px;

cursor:pointer;

font-size:20px;

}



.stats{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:15px;

}



.stat{

background:#fafafa;

padding:20px;

border-radius:15px;

text-align:center;

}



.stat h2{

color:#6B2C91;

font-size:35px;

}



.item{

background:#fafafa;

padding:20px;

border-radius:15px;

margin-top:15px;

border:1px solid #ddd;

}



.approve{
background:green;
}


.reject{
background:red;
}


.edit{
background:#008000;
}


.delete{
background:#d00000;
}



.image-box{

margin-top:15px;

padding:15px;

background:#fafafa;

border-radius:15px;

border:1px dashed #aaa;

text-align:center;

}



.file-label{

display:block;

background:#6B2C91;

color:white;

padding:12px;

border-radius:10px;

cursor:pointer;

}



input[type=file]{

display:none;

}



.image-preview{

width:250px;

height:250px;

object-fit:cover;

border-radius:15px;

margin:15px auto;

display:none;

}



/* ==========================
   MOBILE FRIENDLY MODAL
========================== */


.modal{

display:none;

position:fixed;

top:0;

left:0;

width:100%;

height:100%;

background:rgba(0,0,0,0.55);

align-items:flex-start;

justify-content:center;

padding:20px;

overflow-y:auto;

z-index:9999;

}



.modal-box{

background:white;

padding:25px;

width:95%;

max-width:500px;

border-radius:20px;

margin-top:20px;

margin-bottom:50px;

}



.modal-header{

display:flex;

justify-content:space-between;

align-items:center;

position:sticky;

top:0;

background:white;

padding-bottom:10px;

}



.close-btn{

width:40px !important;

height:40px;

padding:0;

background:red;

border-radius:50%;

font-size:20px;

color:white;

}



@media(max-width:600px){


.modal-box{

width:100%;

padding:20px;

}



.image-preview{

width:200px;

height:200px;

}



}



.modal-header{

display:flex;

justify-content:space-between;

align-items:center;

}



.close-btn{

width:40px !important;

height:40px;

padding:0;

background:red;

border-radius:50%;

font-size:20px;

}



@media(max-width:600px){

.stats{

grid-template-columns:1fr;

}


.header h1{

font-size:20px;

}

}


</style>


</head>


<body>


<div class="container">



<div class="header">


<h1>
Voice of Goila Admin
</h1>



<button class="menu-btn" onclick="toggleMenu()">
☰
</button>



</div>




<div id="menu" class="menu">


<button onclick="showDashboard()">
Dashboard
</button>


<button onclick="showDirectory()">
Directory
</button>


<button onclick="logout()">
Logout
</button>


</div>




<div class="card" id="loginBox">


<h2>
Admin Login
</h2>



<input 
id="email"
placeholder="Email"
>




<div class="password-box">


<input

id="password"

type="password"

placeholder="Password"

>



<span 
class="password-eye"
onclick="togglePassword()">

👁

</span>


</div>




<button onclick="login()">

Login

</button>



  </div>

  <!-- DASHBOARD -->

<div id="dashboard" style="display:none;">


<div class="card">


<div class="stats">


<div class="stat">

<h3>Total</h3>

<h2 id="total">
0
</h2>

</div>




<div class="stat">

<h3>Pending</h3>

<h2 id="pendingCount">
0
</h2>

</div>




<div class="stat">

<h3>Approved</h3>

<h2 id="approvedCount">
0
</h2>

</div>


</div>


</div>







<!-- PENDING -->

<div class="card">


<h2>
Pending Submission
</h2>




<div class="image-box">


<label class="file-label">

📷 Choose Image


<input

type="file"

id="submissionImage"

accept="image/*"

onchange="previewImage(event)"

>


</label>



<img

id="imagePreview"

class="image-preview"

>



</div>




<div id="pending">

Loading...

</div>



</div>








<!-- DIRECTORY -->


<div class="card">


<h2>
Directory Management
</h2>



<input

id="searchBox"

placeholder="Search..."

>



<div id="directory">

Loading...

</div>



</div>




</div>









<!-- EDIT MODAL -->


<div id="editModal" class="modal">


<div class="modal-box">


<div class="modal-header">


<h2>
Edit Information
</h2>



<button

class="close-btn"

onclick="closeEditModal()">

✕

</button>



</div>





<input

id="editId"

type="hidden"

>




<input

id="editName"

placeholder="Name"

>




<select

id="editCat"

onchange="changeSubCategory()">

</select>





<select

id="editSubcat">

</select>





<input

id="editPhone"

placeholder="Phone"

>




<textarea

id="editAddress"

placeholder="Address">

</textarea>





<input

id="editMap"

placeholder="Map URL"

>




<textarea

id="editDescription"

placeholder="Description">

</textarea>







<div class="image-box">



<label class="file-label">

📷 Change Image



<input

type="file"

id="editImage"

accept="image/*"

onchange="showEditImage(event)"

>


</label>



<p id="editImageName">

No image selected

</p>




<img

id="editImagePreview"

class="image-preview"

>



</div>







<button onclick="updateDirectory()">

Save Changes

</button>



</div>


</div>








<script src="js/supabase.js"></script>

<script src="js/admin.js"></script>



<script>


function togglePassword(){


let pass =
document.getElementById("password");



if(pass.type==="password"){


pass.type="text";


}

else{


pass.type="password";


}


}




function showEditImage(event){


const file =
event.target.files[0];



const name =
document.getElementById("editImageName");



const preview =
document.getElementById("editImagePreview");



if(file){


name.innerHTML =
"Selected Image: " + file.name;



preview.src =
URL.createObjectURL(file);



preview.style.display="block";



}



}



</script>



</div>


</body>

  </html>
