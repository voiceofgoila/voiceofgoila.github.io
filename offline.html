<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#692795"><title>ইন্টারনেট সংযোগ নেই | Voice of Goila</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(155deg,#f9f6ff,#eee5f8);font-family:system-ui,'Noto Sans Bengali',sans-serif;color:#342144;text-align:center}.card{max-width:430px;width:100%;background:white;padding:38px 25px;border:1px solid #eadcf2;border-radius:25px;box-shadow:0 16px 50px #52227818}.icon{width:86px;height:86px;margin:0 auto 20px;border-radius:25px;background:#f0e3f9;display:grid;place-items:center;color:#71269b}h1{font-size:24px;margin:0 0 12px}p{font-size:15px;line-height:1.9;color:#766582;margin:0 0 23px}button{width:100%;border:0;border-radius:13px;background:linear-gradient(120deg,#56217b,#9339bd);padding:15px;color:white;font-size:16px;font-weight:700;cursor:pointer}.msg{min-height:22px;margin-top:13px;color:#80598f;font-size:13px}</style></head><body><main class="card"><div class="icon"><svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 9a15 15 0 0 1 18-1M5 12a10 10 0 0 1 11-1M9 16a5 5 0 0 1 5 0M2 2l20 20"/></svg></div><h1>ইন্টারনেট সংযোগ নেই</h1><p>আপনার ইন্টারনেট কানেকশন চালু নেই। দয়া করে মোবাইল ডাটা বা Wi-Fi চালু করে আবার ওয়েবসাইটে প্রবেশ করুন।</p><button id="retry">↻ আবার চেষ্টা করুন</button><div class="msg" id="msg" aria-live="polite"></div></main><script>const b=document.getElementById('retry'),m=document.getElementById('msg');b.onclick=async()=>{b.disabled=true;b.textContent='সংযোগ পরীক্ষা হচ্ছে...';m.textContent='';try{const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);try{const r=await fetch('/?vog_connection_check='+Date.now(),{method:'HEAD',cache:'no-store',signal:c.signal});if(!r.ok)throw Error('offline');location.reload();return}finally{clearTimeout(t)}}catch(e){m.textContent='এখনও ইন্টারনেট পাওয়া যাচ্ছে না। আবার চেষ্টা করুন।';b.disabled=false;b.textContent='↻ আবার চেষ্টা করুন'}};window.addEventListener('online',()=>location.reload());</script></body></html>
