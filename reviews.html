<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>সব রিভিউ | Voice of Goila</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf7fc;color:#2d1934;font-family:system-ui,"Noto Sans Bengali",sans-serif}header{background:linear-gradient(115deg,#57216f,#773295);color:white;padding:20px 16px 32px}.wrap{max-width:760px;margin:auto}.back{display:inline-block;color:white;text-decoration:none;font-size:13px;border:1px solid #ffffff50;border-radius:24px;padding:7px 13px}h1{font-size:25px;margin:22px 0 6px}header p{font-size:13px;color:#ffffffc7;margin:0}main{padding:24px 16px 50px}.summary,.review{background:white;border:1px solid #e9dfec;border-radius:19px;padding:18px;margin-bottom:12px;box-shadow:0 6px 20px #48225508}.summary strong{font-size:34px;color:#713092}.stars{color:#c9992c;letter-spacing:2px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.review b{font-size:15px}.review p{line-height:1.7;color:#625568;margin:10px 0 0;overflow-wrap:anywhere}.muted{color:#7b7180;font-size:13px}.empty{text-align:center;padding:35px 12px;color:#746a79}.loading{text-align:center;padding:30px;color:#776b7d}
</style></head><body><header><div class="wrap"><a class="back" href="index.html#reviewSection">← হোমপেজে ফিরে যান</a><h1>⭐ সব রিভিউ ও রেটিং</h1><p>Voice of Goila সম্পর্কে কমিউনিটির অভিজ্ঞতা</p></div></header><main class="wrap"><div class="summary"><strong id="average">—</strong><span class="muted"> / ৫</span><div id="summaryStars" class="stars">☆☆☆☆☆</div><div id="count" class="muted">রিভিউ লোড হচ্ছে...</div></div><div id="list" class="loading">রিভিউ লোড হচ্ছে...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js?v=20260819-1625"></script><script>
const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
(async()=>{const list=document.getElementById('list');try{if(!window.supabaseClient)throw Error('সার্ভিস সংযোগ পাওয়া যাচ্ছে না');const {data,error}=await window.supabaseClient.from('reviews').select('id,rating,name,review_text,created_at').eq('status','approved').order('created_at',{ascending:false});if(error)throw error;const rows=data||[];document.getElementById('count').textContent=rows.length+'টি অনুমোদিত রিভিউ';const avg=rows.length?rows.reduce((a,r)=>a+Number(r.rating||0),0)/rows.length:0;document.getElementById('average').textContent=avg.toFixed(1);document.getElementById('summaryStars').textContent='★'.repeat(Math.round(avg))+'☆'.repeat(5-Math.round(avg));list.className='';list.innerHTML=rows.length?rows.map(r=>{const rating=Math.max(1,Math.min(5,Number(r.rating)||1));return '<article class="review"><div class="top"><b>'+escapeHTML(r.name||'একজন ব্যবহারকারী')+'</b><span class="stars">'+'★'.repeat(rating)+'☆'.repeat(5-rating)+'</span></div>'+(r.review_text?'<p>'+escapeHTML(r.review_text)+'</p>':'')+'</article>'}).join(''):'<div class="empty">এখনও কোনো অনুমোদিত রিভিউ নেই।</div>';}catch(e){list.className='empty';list.textContent='রিভিউ লোড করা যায়নি। অনুগ্রহ করে আবার চেষ্টা করুন।';console.warn(e)}})();
</script></body></html>
