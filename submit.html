<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>তথ্য যোগ করুন - Voice of Goila</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

body{
font-family:Arial;
background:#f5f5f5;
padding:20px;
}

.form-box{

max-width:500px;
margin:auto;
background:white;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px #ddd;

}


h2{
text-align:center;
color:#6B2C91;
}


input,select,textarea,button{

width:100%;
padding:12px;
margin-top:12px;
border-radius:8px;
border:1px solid #ddd;

}


button{

background:#6B2C91;
color:white;
border:none;
font-size:16px;
cursor:pointer;

}


</style>

</head>


<body>


<div class="form-box">


<h2>
আপনার তথ্য যোগ করুন
</h2>


<form id="submitForm">


<input id="name" placeholder="প্রতিষ্ঠানের নাম" required>


<select id="cat" required>

<option value="">
ক্যাটাগরি নির্বাচন করুন
</option>

<option value="health">স্বাস্থ্য</option>
<option value="education">শিক্ষা</option>
<option value="business">ব্যবসা</option>
<option value="government">সরকারি সেবা</option>
<option value="other">অন্যান্য</option>

</select>


<input id="subcat" placeholder="সাব-ক্যাটাগরি">


<input id="phone" placeholder="ফোন নাম্বার">


<input id="map_url" placeholder="Google Map Link">


<textarea id="address" placeholder="ঠিকানা"></textarea>


<textarea id="description" placeholder="বিস্তারিত তথ্য"></textarea>


<button type="submit">
তথ্য জমা দিন
</button>


</form>


</div>



<script src="js/supabase.js"></script>

<script src="js/submit.js"></script>


</body>

</html>
