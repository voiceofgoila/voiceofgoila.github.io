<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>পাসওয়ার্ড রিসেট | Voice of Goila</title>
<style>
:root{font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;color:#281632;background:#f6f2f9}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}.card{width:min(100%,440px);background:white;border:1px solid #e8dceb;border-radius:20px;padding:26px;box-shadow:0 16px 50px #34174616}h1{font-size:24px;margin:0 0 8px}p{color:#675d6d;font-size:14px;line-height:1.7}.brand{font-size:14px;font-weight:800;color:#6b2c91;margin-bottom:16px}label{display:block;margin:14px 0 6px;font-weight:700;font-size:13px}input{display:block;width:100%;padding:13px;border:1px solid #d8cadf;border-radius:10px;font-size:15px;outline:none}input:focus{border-color:#6b2c91;box-shadow:0 0 0 3px #6b2c9119}button{width:100%;padding:13px;border:0;border-radius:10px;background:#6b2c91;color:white;font-size:15px;font-weight:800;cursor:pointer;margin-top:16px}button:disabled{opacity:.65;cursor:wait}a{color:#6b2c91;font-weight:700}#status{margin-top:14px;font-size:13px;line-height:1.6;border-radius:9px;padding:10px;background:#f5eff9;display:none}#status.error{background:#fff0f0;color:#a32136}#status.ok{background:#eaf8ef;color:#176b39}.hidden{display:none!important}.foot{margin-top:18px;text-align:center;font-size:13px}
</style></head><body><main class="card"><div class="brand">✦ Voice of Goila · Admin Security</div><h1>পাসওয়ার্ড রিসেট</h1><p id="intro">অ্যাডমিন অ্যাকাউন্টের ইমেইল দিয়ে রিসেট লিংক নিন।</p>
<form id="requestForm"><label for="email">অ্যাডমিন ইমেইল</label><input id="email" type="email" autocomplete="email" required placeholder="your@email.com"><button id="sendBtn" type="submit">রিসেট লিংক পাঠান</button></form>
<form id="changeForm" class="hidden"><label for="newPass">নতুন পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)</label><input id="newPass" type="password" autocomplete="new-password" minlength="8" required><label for="confirmPass">পাসওয়ার্ড আবার লিখুন</label><input id="confirmPass" type="password" autocomplete="new-password" minlength="8" required><button id="changeBtn" type="submit">নতুন পাসওয়ার্ড সংরক্ষণ করুন</button></form>
<div id="status" role="status" aria-live="polite"></div><div class="foot"><a href="admin.html">← Admin Login</a> · <a href="index.html">মূল ওয়েবসাইট</a></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/supabase.js"></script>
<script>
(function(){
  'use strict';
  const client=window.supabaseClient;
  const requestForm=document.getElementById('requestForm'),changeForm=document.getElementById('changeForm');
  const status=document.getElementById('status'),intro=document.getElementById('intro');
  let recoveryVerified=false;
  const params=new URLSearchParams(location.search),hash=new URLSearchParams(location.hash.substring(1));
  const recoveryLink=params.get('type')==='recovery'||hash.get('type')==='recovery'||params.has('token_hash')&&params.get('type')==='recovery';
  function msg(value,error){status.textContent=value;status.style.display='block';status.className=error?'error':'ok'}
  function showChange(){recoveryVerified=true;requestForm.classList.add('hidden');changeForm.classList.remove('hidden');intro.textContent='নিচে আপনার নতুন পাসওয়ার্ড দিন।';msg('রিসেট লিংক যাচাই হয়েছে। এখন নতুন পাসওয়ার্ড সেট করুন।',false)}
  client.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)showChange()});
  async function init(){
    if(!recoveryLink)return;
    if(params.get('error')||hash.get('error')){msg('রিসেট লিংকটি মেয়াদোত্তীর্ণ বা অকার্যকর। নতুন লিংক পাঠান।',true);return}
    try{
      if(params.has('token_hash')&&params.get('type')==='recovery'){
        const {error}=await client.auth.verifyOtp({token_hash:params.get('token_hash'),type:'recovery'});
        if(error)throw error;
      }else if(params.has('code')){
        const {error}=await client.auth.exchangeCodeForSession(params.get('code'));
        if(error){const {data}=await client.auth.getSession();if(!data.session)throw error;}
      }
      const {data,error}=await client.auth.getSession();if(error)throw error;
      if(data.session)showChange();else msg('লিংকটি যাচাই করা যায়নি। নতুন রিসেট ইমেইল পাঠান।',true);
    }catch(e){msg('রিসেট লিংকটি ব্যবহার করা যাচ্ছে না: '+(e.message||'আবার চেষ্টা করুন'),true)}
  }
  requestForm.addEventListener('submit',async e=>{
    e.preventDefault();const btn=document.getElementById('sendBtn');btn.disabled=true;
    try{
      const redirectTo=new URL('reset-password.html',location.href).origin+new URL('reset-password.html',location.href).pathname;
      const {error}=await client.auth.resetPasswordForEmail(document.getElementById('email').value.trim(),{redirectTo});
      if(error)throw error;
      msg('ইমেইলটি নিবন্ধিত থাকলে রিসেট লিংক পাঠানো হয়েছে। Inbox ও Spam দেখুন।',false);
    }catch(err){msg('লিংক পাঠানো যায়নি: '+(err.message||'পরে চেষ্টা করুন'),true)}finally{btn.disabled=false}
  });
  changeForm.addEventListener('submit',async e=>{
    e.preventDefault();if(!recoveryVerified){msg('আগে ইমেইলের রিসেট লিংক দিয়ে প্রবেশ করুন।',true);return}
    const password=document.getElementById('newPass').value,confirm=document.getElementById('confirmPass').value;
    if(password!==confirm){msg('দুটি পাসওয়ার্ড মিলছে না।',true);return}
    if(password.length<8){msg('কমপক্ষে ৮ অক্ষরের পাসওয়ার্ড দিন।',true);return}
    const btn=document.getElementById('changeBtn');btn.disabled=true;
    try{const {error}=await client.auth.updateUser({password});if(error)throw error;
      await client.auth.signOut();changeForm.classList.add('hidden');intro.textContent='নতুন পাসওয়ার্ড সেট হয়েছে। এখন অ্যাডমিন প্যানেলে লগইন করুন।';
      msg('পাসওয়ার্ড সফলভাবে পরিবর্তিত হয়েছে। Admin Login-এ ফিরে যান।',false);
      history.replaceState(null,'',location.pathname);
    }catch(err){msg('পাসওয়ার্ড পরিবর্তন করা যায়নি: '+(err.message||'পরে চেষ্টা করুন'),true)}finally{btn.disabled=false}
  });
  init();
})();
</script></body></html>
